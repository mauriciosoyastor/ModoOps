[options]
# DEV-ONLY (localhost): admin/admin + odoo/odoo. En VPS prod usar un
# odoo.conf dedicado con secretos propios; nunca commitear el de prod.
# db_password debe coincidir con POSTGRES_PASSWORD del compose (default odoo).
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
; La entrada al POS es auth=none: tiene que estar en el mapa sin base.
server_wide_modules = base,web,modoops_core
data_dir = /var/lib/odoo
admin_passwd = admin
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
log_level = info
workers = 0
