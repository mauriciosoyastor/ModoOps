# ModoOps — Stack dev local (Odoo CE 19 + Postgres 16)
# Uso: docker compose up -d && open http://localhost:8070 (5434 para PG)
# Evita colisión con Servigas (8069/5433). Ver docs/modoops-control-plane-spec.md y CONTEXT.md:237

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0

  odoo:
    image: odoo:19.0
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8070:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
      PYTHONPATH: /mnt/extra-addons
    volumes:
      - ./modoops_core:/mnt/extra-addons/modoops_core
      - ./modoops_admin:/mnt/extra-addons/modoops_admin
      - ./modoops_ia:/mnt/extra-addons/modoops_ia
      - ./modoops_catalogo:/mnt/extra-addons/modoops_catalogo
      - odoo_data:/var/lib/odoo
      - ./odoo.conf:/etc/odoo/odoo.conf
    command: --dev=all

  web:
    image: node:22-alpine
    depends_on:
      odoo:
        condition: service_started
    restart: unless-stopped
    # G11: working_dir /app chocaba con la ruta /app en dev (Vite intentaba
    # leer el directorio como módulo → EISDIR). /srv/app evita la colisión.
    working_dir: /srv/app
    ports:
      - "3001:3001"
    volumes:
      - ./web:/srv/app
      # deps Linux solo-contenedor: el host corre su propio dev :4321 con node_modules Windows
      - web_node_modules:/srv/app/node_modules
    env_file:
      - web/.env
    environment:
      ODOO_URL: http://odoo:8069
    # bind-mount directo: las deps del host sirven (el binding musl de rollup
    # falta en el log pero las rutas verificadas renderizan igual)
    # pin local (npx resolvía astro@7 del registry y rompía el boot; local es 5.18.2)
    command: ["node", "/srv/app/node_modules/astro/astro.js", "dev", "--host", "0.0.0.0", "--port", "3001"]

volumes:
  db_data:
  odoo_data:
  ollama_data:
  web_node_modules:
