name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # stdlib-only logic, but ensure pytest available for CI
          pip install pytest
          # seam test tools/indice_codigo/test_frescor_crg.py shells out to this CLI
          pip install code-review-graph
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f modoops_ia/requirements.txt ]; then pip install -r modoops_ia/requirements.txt; fi

      - name: Pytest — modoops_ia logic (19 tests)
        run: python -m pytest modoops_ia/tests -q

      - name: Pytest — tooling (grafo, configurador, indice, provision)
        run: python -m pytest tools/grafo/tests tools/configurador/tests tools/indice_codigo/test_frescor_crg.py tools/indice_codigo/tests tools/modoops_provision/tests -q

      - name: Python script-tests — fiscal guard + POS lock (sin Odoo)
        run: python modoops_core/tests/test_modoops_fiscal_guard.py && python modoops_core/tests/test_modoops_pos_entrada_lock.py

      - name: Pytest — laya (workdir propio por imports relativos)
        working-directory: tools/laya
        run: python -m pytest tests -q

      # Fuera del gate (follow-up ítems 8-9):
      # - modoops_admin/tests: 1 rojo pre-existente (Provisioning en log views)
      # - modoops_core/tests: requieren Odoo (import odoo en tests)
      # - tsc --noEmit: errores pre-existentes (narrowing DecideResult, mocks)
      # - eslint/ruff: sin config en el repo

      - name: Pure-module guard — no Odoo import in logic/
        run: |
          echo "Checking modoops_ia/logic/*.py has no 'import odoo'..."
          ! grep -R --exclude-dir=__pycache__ "import odoo\|from odoo" modoops_ia/logic/ 2>/dev/null

      - name: Install Node deps (root + web)
        run: npm ci --ignore-scripts

      - name: Vitest — web BFF
        working-directory: web
        run: npx vitest run

      - name: Check — 3D models manifest + weight budget
        run: node tools/check-models.mjs

      - name: Check — Cloudflare deploy contract
        run: npm run check:deploy-contract

      - name: Build — web (Astro)
        run: npm run build

      - name: Check — wrangler dry-run
        env:
          CLOUDFLARE_API_TOKEN: dummy
          CLOUDFLARE_ACCOUNT_ID: dummy
        run: npx wrangler deploy --dry-run --config wrangler.toml --no-autoconfig || echo "wrangler dry-run skipped (no real token) — build already validated"
